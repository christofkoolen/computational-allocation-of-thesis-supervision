[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-thesis-allocation"
version = "0.1.0"
description = "A reproducible pipeline for thesis topic and supervisor allocation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]

[project.scripts]
thesis-allocation = "thesis_allocation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

